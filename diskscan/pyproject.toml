[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskscan"
version = "2.0.0"
description = "Disk usage analyzer, duplicate file finder and HTML treemap reports. No dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
diskscan = "diskscan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
